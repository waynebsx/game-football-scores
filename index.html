<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goals">
<meta name="theme-color" content="#1f9a3a">
<title>Goal Counter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Lilita One by Juan Montoreano, SIL Open Font License (fonts/OFL.txt) */
  @font-face { font-family: "Lilita One"; font-display: swap; src: url(fonts/lilita-one.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Lilita One"; font-display: swap; src: url(fonts/lilita-one-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { --font: "Lilita One", "Arial Black", Impact, system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f9a3a; font-family: var(--font); color: #fff; }
  body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  #pitch { z-index: 0; }
  #fx { z-index: 5; pointer-events: none; }

  /* The two halves sit below the top bar (--top is measured in JS).
     Side by side in landscape; stacked (home on top) in portrait. */
  .ui {
    position: fixed; inset: 0; z-index: 2; display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
    padding-top: var(--top, 70px);
  }
  body.portrait .ui { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .side {
    container-type: size; overflow: hidden; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    padding: 1% 3% 2%;
  }
  #side0 { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 38%, transparent), color-mix(in srgb, var(--c) 8%, transparent)); }
  #side1 { background: linear-gradient(270deg, color-mix(in srgb, var(--c) 38%, transparent), color-mix(in srgb, var(--c) 8%, transparent)); }
  body.portrait #side0 { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 38%, transparent), color-mix(in srgb, var(--c) 8%, transparent)); }
  body.portrait #side1 { background: linear-gradient(0deg, color-mix(in srgb, var(--c) 38%, transparent), color-mix(in srgb, var(--c) 8%, transparent)); }

  .teamrow { display: flex; align-items: center; gap: 2cqw; width: min(100%, 34rem); }
  .name {
    flex: 1; min-width: 0; font: inherit; font-size: min(8.5cqh, 8cqw); text-align: center; color: #fff;
    background: var(--c); border: 4px solid #fff; border-radius: 999px; padding: .1em .6em;
    box-shadow: 0 5px 0 rgba(0,0,0,.25); text-shadow: 0 2px 0 rgba(0,0,0,.3); outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .name:focus { box-shadow: 0 0 0 6px #ffe600, 0 5px 0 rgba(0,0,0,.25); }
  .swatch {
    position: relative; flex: none; width: min(10cqh, 9cqw); height: min(10cqh, 9cqw); min-width: 30px; min-height: 30px;
    border-radius: 50%; border: 4px solid #fff; background: conic-gradient(#ff3b5c, #ffb800, #ffe600, #3ddc4a, #1e90ff, #a24dff, #ff3b5c);
    box-shadow: 0 5px 0 rgba(0,0,0,.25); cursor: pointer;
  }
  .swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }

  .score {
    font-size: min(40cqh, 55cqw); line-height: .85; color: #fff;
    text-shadow: 0 .06em 0 var(--c), 0 .1em 0 rgba(0,0,0,.35), 0 0 .25em rgba(0,0,0,.35);
    -webkit-text-stroke: .025em var(--c);
    font-variant-numeric: tabular-nums;
  }
  .score.bump { animation: bump .6s cubic-bezier(.2,1.6,.4,1); }
  .score.drop { animation: drop .5s ease; }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.45) rotate(-6deg); } 100% { transform: scale(1); } }
  @keyframes drop { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-.08em); } 40% { transform: translateX(.08em); } 60% { transform: translateX(-.05em); } 80% { transform: translateX(.05em); } }

  button { font: inherit; cursor: pointer; border: 0; color: #fff; }
  .goal {
    font-size: min(12cqh, 12cqw); padding: .2em 1.1em; border-radius: 999px; letter-spacing: .04em; max-width: 100%;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%);
    border: 5px solid #fff; text-shadow: 0 3px 0 rgba(0,0,0,.3);
    box-shadow: 0 .14em 0 color-mix(in srgb, var(--c) 55%, #000), 0 .3em .6em rgba(0,0,0,.35);
    transition: transform .06s;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .goal:active { transform: translateY(.1em) scale(.97); box-shadow: 0 .04em 0 color-mix(in srgb, var(--c) 55%, #000); animation: none; }
  @keyframes pulse { 0%,100% { scale: 1; } 50% { scale: 1.04; } }
  .minus {
    font-size: max(13px, min(5cqh, 4.6cqw)); padding: .3em 1em; border-radius: 999px;
    background: rgba(0,0,0,.35); border: 3px solid rgba(255,255,255,.8);
  }
  .minus:active { background: rgba(0,0,0,.6); }

  /* compact top bar: [Start] [clock] [Menu] in one row */
  .topbar {
    position: fixed; z-index: 3; top: calc(env(safe-area-inset-top) + 8px); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: clamp(6px, 1.2vw, 14px); white-space: nowrap;
  }
  .clock {
    font-size: clamp(22px, min(8vh, 7vw), 72px); line-height: 1; padding: .1em .4em; border-radius: .35em;
    background: #111a; border: 4px solid #ffe600; color: #ffe600; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 .3em rgba(255,230,0,.6); box-shadow: 0 5px 0 rgba(0,0,0,.3);
  }
  .clock.paused { animation: blink 1.2s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .45; } }
  .ctrl {
    font-size: clamp(13px, min(3.4vh, 3.6vw), 30px); padding: .35em .75em; border-radius: 999px; white-space: nowrap;
    background: #fff; color: #222; box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  .ctrl:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .ctrl.go { background: #ffe600; }
  .ctrl.off { background: #bbb; color: #555; text-decoration: line-through; }

  #flash {
    position: fixed; z-index: 6; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: min(30vh, 22vw); color: #ffe600; opacity: 0;
    text-shadow: 0 .05em 0 #ff3b5c, 0 .1em 0 #1e90ff, 0 0 .3em rgba(0,0,0,.5);
    -webkit-text-stroke: .02em #fff;
  }
  #flash.show { animation: flash 1.8s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes flash {
    0% { opacity: 0; transform: scale(.2) rotate(-12deg); }
    20% { opacity: 1; transform: scale(1.1) rotate(4deg); }
    35% { transform: scale(1) rotate(-2deg); }
    80% { opacity: 1; transform: scale(1.04) rotate(0); }
    100% { opacity: 0; transform: scale(1.6); }
  }
  .ctrl:disabled { opacity: .6; }
  .menugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
  .mbtn {
    font-size: 1.35rem; padding: .55em .8em; border-radius: 18px; text-align: left; white-space: nowrap;
    background: #e9f7ec; color: #155c27; border: 3px solid #1f9a3a; box-shadow: 0 4px 0 #9bd3a8;
  }
  .mbtn:active { transform: translateY(3px); box-shadow: none; }
  .mbtn[hidden] { display: none; }
  .mbtn.go { background: #ffe600; border-color: #c9b500; color: #222; box-shadow: 0 4px 0 #c9b500; }
  .mbtn.off { background: #eee; border-color: #bbb; color: #888; box-shadow: 0 4px 0 #ccc; }
  .credits { margin-top: 18px; font-size: .8rem; }
  .clock.ending { color: #ff3b5c; border-color: #ff3b5c; animation: blink .5s steps(2, start) infinite; }

  .modal { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; background: rgba(0, 30, 10, .65); }
  .modal[hidden] { display: none; }
  .card {
    position: relative; width: min(760px, 100%); max-height: calc(100dvh - 32px); overflow: auto;
    background: #fff; color: #222; border: 6px solid #ffe600; border-radius: 26px; padding: 20px 24px 24px;
    box-shadow: 0 12px 0 rgba(0,0,0,.3); user-select: text; -webkit-user-select: text;
  }
  .card h2 { margin: 0 50px 10px 0; font-weight: normal; font-size: 2.3rem; color: #1f9a3a; }
  .card h3 { margin: 22px 0 6px; font-weight: normal; font-size: 1.5rem; color: #555; }
  .close { position: absolute; top: 12px; right: 12px; width: 46px; height: 46px; border-radius: 50%; background: #eee; color: #333; font-size: 1.3rem; }
  .note { font-family: system-ui, sans-serif; color: #666; font-size: 1.05rem; }
  .warnText { color: #d1123f; }
  .center { text-align: center; justify-content: center; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; align-items: center; }
  .big { font-size: 1.4rem; padding: .45em 1.1em; border-radius: 999px; background: #1f9a3a; color: #fff; box-shadow: 0 5px 0 #0d5c20; }
  .big.alt { background: #eee; color: #333; box-shadow: 0 5px 0 #bbb; }
  .big.warn { background: #ff2e63; box-shadow: 0 5px 0 #a3132e; }
  .big.small { font-size: 1.05rem; }
  .big:active { transform: translateY(3px); box-shadow: none; }
  .big:disabled, .choice:disabled { opacity: .45; }
  .choices { display: flex; flex-wrap: wrap; gap: 10px; }
  .choice { font-size: 1.5rem; padding: .35em .9em; border-radius: 999px; background: #e9f7ec; color: #1f9a3a; border: 3px solid #1f9a3a; }
  .choice.on { background: #1f9a3a; color: #fff; }
  .custom { font-size: 1.4rem; }
  .custom input { width: 4.5em; font: inherit; padding: .15em .4em; border-radius: 12px; border: 3px solid #1f9a3a; }
  .ft-score { text-align: center; font-size: clamp(2.2rem, 8vw, 4.4rem); margin: 8px 0; }
  .ft-msg { text-align: center; font-size: 2rem; color: #ff2e63; }
  .leader { font-size: 1.5rem; margin: 4px 0 12px; }
  .leader b { font-weight: normal; color: #ff2e63; }
  .scroll { overflow-x: auto; }
  .league { width: 100%; border-collapse: collapse; font-size: 1.2rem; }
  .league th { font-weight: normal; color: #888; font-size: .85rem; padding: 4px 6px; }
  .league td { text-align: center; padding: 7px 6px; border-top: 2px solid #eee; font-variant-numeric: tabular-nums; }
  .league .team { text-align: left; }
  .league .w { color: #1f9a3a; font-size: 1.4rem; }
  .league tr.top td { background: #fff6bf; }
  .chip { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin: 0 .35em; vertical-align: -.05em; border: 2px solid rgba(0,0,0,.15); }
  .games { list-style: none; margin: 0; padding: 0; }
  .games li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 2px solid #eee; font-size: 1.25rem; }
  .games .when { font-family: system-ui, sans-serif; color: #999; font-size: .8rem; white-space: nowrap; }
  .games .match { flex: 1; }
  .games .sc { font-weight: normal; margin: 0 .4em; white-space: nowrap; }
  .games .win { color: #1f9a3a; }
  .games .del { background: none; color: #bbb; font-size: 1.3rem; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="pitch"></canvas>

<div class="ui" id="ui"></div>

<div class="topbar" id="topbar">
  <button class="ctrl go" id="startBtn">▶ Start</button>
  <div class="clock paused" id="clock">00:00</div>
  <button class="ctrl" id="menuBtn">☰ Menu</button>
</div>

<div id="flash">GOAL!</div>
<canvas id="fx"></canvas>
<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true"><button class="close" aria-label="Close">✕</button><div class="body"></div></div>
</div>
<div class="modal" id="menu" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-label="Menu"><button class="close" aria-label="Close">✕</button>
    <h2>☰ Menu</h2>
    <div class="menugrid">
      <button class="mbtn" id="endBtn">🏁 Full Time</button>
      <button class="mbtn" id="newBtn">↺ New Game</button>
      <button class="mbtn" id="resultsBtn">🏆 Results</button>
      <button class="mbtn" id="limitBtn">⏱ No time limit</button>
      <button class="mbtn toggle" id="musicBtn">🎵 Music</button>
      <button class="mbtn toggle" id="sfxBtn">🎺 Fanfare</button>
      <button class="mbtn" id="fsBtn">⛶ Full Screen</button>
      <button class="mbtn go" id="installBtn" hidden>📲 Install app</button>
    </div>
    <p class="note credits">Font: Lilita One (SIL OFL) · Instruments: FluidR3 GM soundfont (MIT)</p>
  </div>
</div>

<script>
(() => {
  // ---------- State (saved to localStorage) ----------
  const KEY = 'goalCounter.v1';
  const defaults = {
    teams: [
      { name: 'Home', color: '#ff2e63', score: 0 },
      { name: 'Away', color: '#1e90ff', score: 0 }
    ],
    elapsed: 0,        // ms accumulated while paused
    startedAt: null,   // epoch ms when running, else null
    limit: 0,          // game length in minutes, 0 = no limit (count up)
    finished: false,   // full time reached for the current game
    gameId: null,      // id of the saved record once finished
    history: [],       // saved results, newest first
    music: true,       // background music
    sfx: true          // fanfare, whistle, trombone
  };
  let state;
  try { state = Object.assign(structuredClone(defaults), JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch { state = structuredClone(defaults); }
  const save = () => { syncRecord(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  // ---------- Build the two halves ----------
  const ui = document.getElementById('ui');
  const sides = state.teams.map((t, i) => {
    const el = document.createElement('section');
    el.className = 'side'; el.id = 'side' + i;
    el.innerHTML = `
      <div class="teamrow">
        ${i === 1 ? '' : '<label class="swatch" title="Team colour"><input type="color"></label>'}
        <input class="name" maxlength="20" spellcheck="false" aria-label="Team name">
        ${i === 1 ? '<label class="swatch" title="Team colour"><input type="color"></label>' : ''}
      </div>
      <div class="score">0</div>
      <button class="goal">GOAL!</button>
      <button class="minus">− Take one off</button>`;
    ui.appendChild(el);
    const name = el.querySelector('.name'), color = el.querySelector('input[type=color]');
    const score = el.querySelector('.score');
    name.value = t.name; color.value = t.color;
    // always go through state.teams[i]: another tab can replace the team objects
    name.addEventListener('input', () => { state.teams[i].name = name.value; save(); });
    name.addEventListener('focus', () => name.select());
    name.addEventListener('keydown', e => { if (e.key === 'Enter') name.blur(); });
    name.addEventListener('blur', () => { if (!name.value.trim()) { name.value = state.teams[i].name = defaults.teams[i].name; save(); } });
    color.addEventListener('input', () => { state.teams[i].color = color.value; paint(); save(); });
    el.querySelector('.goal').addEventListener('click', () => goal(i));
    el.querySelector('.minus').addEventListener('click', () => undo(i));
    return { el, score, name, color };
  });

  function paint() {
    state.teams.forEach((t, i) => {
      sides[i].el.style.setProperty('--c', t.color);
      sides[i].score.textContent = t.score;
    });
  }
  paint();

  function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  function goal(i) {
    state.teams[i].score++; save(); paint();
    retrigger(sides[i].score, 'bump');
    const f = document.getElementById('flash');
    f.style.color = '#ffe600';
    retrigger(f, 'show');
    goalSound();
    confetti(i);
    pitchGoal(i);
  }
  function undo(i) {
    if (state.teams[i].score <= 0) return;
    state.teams[i].score--; save(); paint();
    retrigger(sides[i].score, 'drop');
    sadTrombone();
  }

  // ---------- Helpers ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeColor = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#888888';
  const modal = document.getElementById('modal'), modalBody = modal.querySelector('.body');
  function openModal(html) { modalBody.innerHTML = html; modal.hidden = false; }
  function closeModal() { modal.hidden = true; }
  modal.querySelector('.close').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  // ---------- Timer (counts up, or down when a game length is set) ----------
  const clock = document.getElementById('clock'), startBtn = document.getElementById('startBtn');
  const endBtn = document.getElementById('endBtn'), limitBtn = document.getElementById('limitBtn');
  const running = () => state.startedAt !== null;
  const elapsedMs = () => state.elapsed + (running() ? Date.now() - state.startedAt : 0);
  const limitMs = () => state.limit * 60000;
  const hasActivity = () => elapsedMs() > 1000 || state.teams.some(t => t.score > 0);
  function fmt(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
    const p = n => String(n).padStart(2, '0');
    return h ? `${h}:${p(m)}:${p(ss)}` : `${p(Math.floor(s / 60))}:${p(ss)}`;
  }
  function updateClock() {
    const el = elapsedMs();
    if (state.limit && running() && el >= limitMs()) { fullTime(); return; }
    const left = Math.max(0, limitMs() - el);
    clock.textContent = state.limit ? fmt(Math.ceil(left / 1000) * 1000) : fmt(el);
    clock.classList.toggle('paused', !running() && !state.finished);
    clock.classList.toggle('ending', !!state.limit && running() && left <= 10000);
    startBtn.textContent = state.finished ? '↺ New Game' : running() ? '⏸ Pause' : (state.elapsed ? '▶ Resume' : '▶ Start');
    endBtn.hidden = state.finished;
    limitBtn.textContent = '⏱ ' + (state.limit ? state.limit + ' min game' : 'No time limit');
  }
  startBtn.addEventListener('click', () => {
    if (state.finished) return resetGame();
    if (running()) { state.elapsed = elapsedMs(); state.startedAt = null; releaseWake(); }

    if (quiet) return;

    setTimeout(goalSound, 1900);

  function showFullTime() {

    openModal(`<h2>🏁 Full Time</h2>
      <div class="ft-score"><span style="color:${safeColor(a.color)}">${esc(a.name)}</span>

  }
  endBtn.addEventListener('click', () => {
    if (!hasActivity()) return openModal(`<h2>🏁 Full Time</h2><p class="note">Nothing to save yet. Start the clock or score a goal first.</p>`);
    openModal(`<h2>🏁 End the game?</h2><p class="note">The game stops now and the result is saved to the results table.</p>

  });
  document.getElementById('newBtn').addEventListener('click', () => {
    if (state.finished || !hasActivity()) return resetGame();
    openModal(`<h2>↺ New game?</h2><p class="note">This game isn't finished. Do you want to save the result so far?</p>
      <div class="row"><button class="big" data-act="save-new">💾 Save it, then new game</button>
        <button class="big warn" data-act="discard-new">Don't save</button>

  });

  function showLimit() {
    const opts = [0, 5, 10, 15, 20, 30, 45, 60], dis = running() ? 'disabled' : '';

      ${running() ? '<p class="note warnText">Pause the clock to change the game length.</p>' : ''}
      <div class="choices">${opts.map(m => `<button class="choice ${state.limit === m ? 'on' : ''}" data-act="limit" data-min="${m}" ${dis}>${m ? m + ' min' : 'No limit'}</button>`).join('')}</div>

  }
  limitBtn.addEventListener('click', showLimit);
  function setLimit(m) {
    if (running()) return;

  }

  function showResults() {
    const h = state.history, tbl = {};

      const [a, b] = g.teams;
      for (const [me, op] of [[a, b], [b, a]]) {
        const k = me.name.trim().toLowerCase();
        const r = tbl[k] ??= { name: me.name, color: me.color, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 };
        r.p++; r.gf += me.score; r.ga += op.score;

      }
    }
    const rows = Object.values(tbl).sort((x, y) =>
      y.w - x.w || (y.w * 3 + y.d) - (x.w * 3 + x.d) || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.name.localeCompare(y.name));
    const best = rows[0]?.w || 0, leaders = rows.filter(r => r.w === best && best > 0);

      : leaders.length === 1 ? `<p class="leader">👑 <b>${esc(leaders[0].name)}</b> have won the most games: ${best}</p>`
      : `<p class="leader">👑 Joint top on ${best} win${best > 1 ? 's' : ''}: <b>${leaders.map(r => esc(r.name)).join(' & ')}</b></p>`;
    const chip = c => `<span class="chip" style="background:${safeColor(c)}"></span>`;
    const table = rows.length ? `<div class="scroll"><table class="league">
      <tr><th></th><th class="team">Team</th><th>Played</th><th>Won</th><th>Drawn</th><th>Lost</th><th>Goals</th></tr>
      ${rows.map((r, i) => `<tr class="${r.w === best && best > 0 ? 'top' : ''}"><td>${r.w === best && best > 0 ? '👑' : i + 1}</td>
        <td class="team">${chip(r.color)}${esc(r.name)}</td><td>${r.p}</td><td class="w">${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td>${r.gf}–${r.ga}</td></tr>`).join('')}</table></div>` : '';
    const games = h.length ? `<ul class="games">${h.map(g => {
      const [a, b] = g.teams, d = new Date(g.date);
      return `<li><span class="when">${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: '2-digit' })}<br>
          ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</span>
        <span class="match"><span class="${a.score > b.score ? 'win' : ''}">${chip(a.color)}${esc(a.name)}</span>
          <b class="sc">${a.score} – ${b.score}</b>
          <span class="${b.score > a.score ? 'win' : ''}">${esc(b.name)} ${chip(b.color)}</span></span>

    }).join('')}</ul>
      <div class="row"><button class="big warn small" data-act="clear">🗑 Clear all results</button></div>`
      : '<p class="note">No games saved yet. Results are saved at full time.</p>';
    openModal(`<h2>🏆 Results</h2>${headline}${table}<h3>Previous games</h3>${games}`);

  document.getElementById('resultsBtn').addEventListener('click', showResults);

  // all buttons inside the pop-up

    const btn = e.target.closest('[data-act]'); if (!btn || btn.disabled) return;

      case 'close': closeModal(); break;
      case 'new': resetGame(); closeModal(); break;
      case 'results': showResults(); break;
      case 'end': closeModal(); fullTime(); break;
      case 'save-new': fullTime(true); resetGame(); closeModal(); break;
      case 'discard-new': resetGame(); closeModal(); break;
      case 'limit': setLimit(+btn.dataset.min); break;
      case 'limit-custom': { const v = +document.getElementById('customMin').value; if (v > 0) setLimit(v); break; }

        if (confirm('Delete this game from the results?')) {

        }

    }
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Keep the screen awake while the clock is running

    if (e.key !== KEY || !e.newValue) return;
    try { Object.assign(state, JSON.parse(e.newValue)); } catch { return; }

      if (document.activeElement !== s.name) s.name.value = state.teams[i].name;
      s.color.value = state.teams[i].color;

    if (!state.music) music.stop();

  // ---------- Full screen & sound switches ----------
  const fsBtn = document.getElementById('fsBtn');
  const root = document.documentElement;

  fsBtn.addEventListener('click', () => {

    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);

  const musicBtn = document.getElementById('musicBtn'), sfxBtn = document.getElementById('sfxBtn');
  function showToggles() {
    musicBtn.textContent = state.music ? '🎵 Music: On' : '🎵 Music: Off';
    sfxBtn.textContent = state.sfx ? '🎺 Fanfare: On' : '🎺 Fanfare: Off';
    musicBtn.classList.toggle('off', !state.music); sfxBtn.classList.toggle('off', !state.sfx);
  }
  musicBtn.addEventListener('click', () => {
    state.music = !state.music; save(); showToggles();
    if (state.music) decodeAll(audio()).then(() => music.start());

  sfxBtn.addEventListener('click', () => { state.sfx = !state.sfx; save(); showToggles(); });
  showToggles();

  // ---------- Menu ----------
  const menu = document.getElementById('menu');
  document.getElementById('menuBtn').addEventListener('click', () => { menu.hidden = false; });
  menu.querySelector('.close').addEventListener('click', () => { menu.hidden = true; });
  menu.addEventListener('click', e => {
    if (e.target === menu) menu.hidden = true;

  addEventListener('keydown', e => { if (e.key === 'Escape') menu.hidden = true; });

  const topbar = document.getElementById('topbar');
  const fitTop = () => document.documentElement.style.setProperty('--top', Math.ceil(topbar.getBoundingClientRect().bottom + 8) + 'px');
  new ResizeObserver(fitTop).observe(topbar);
  addEventListener('resize', fitTop);
  fitTop();

  // ---------- Installable app (PWA) ----------
  // The service worker needs the page served over https:// (or http://localhost), not opened as a file.

  }
  const installBtn = document.getElementById('installBtn');
  let installPrompt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; installBtn.hidden = false; });
  addEventListener('appinstalled', () => { installPrompt = null; installBtn.hidden = true; });
  installBtn.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => {});

  // ---------- Sound (generated, no files needed) ----------
  let ac, noiseBuf;
  function audio() {
    ac ??= new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate);

  }
  // ---------- Sampled General MIDI instruments ----------
  // Samples live in the SOUNDS block above this script (see credits there).
  const buffers = {};      // name -> AudioBuffer, e.g. 'trumpet:G4'
  let decoding = null;
  function b64buf(b64) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;

  function decodeAll(a) {
    if (decoding) return decoding;
    const jobs = [];
    for (const inst of ['trumpet', 'marimba', 'bass'])
      for (const [note, b64] of Object.entries(SOUNDS[inst])) jobs.push([inst + ':' + note, b64]);
    decoding = Promise.all(jobs.map(([k, b64]) =>
      new Promise(ok => a.decodeAudioData(b64buf(b64), buf => { buffers[k] = buf; ok(); }, () => ok()))));
    return decoding;

  const NOTE = { C: 0, Db: 1, D: 2, Eb: 3, E: 4, F: 5, Gb: 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
  const midi = n => { const m = n.match(/^([A-G]b?)(-?\d)$/); return NOTE[m[1]] + (+m[2] + 1) * 12; };
  // play an instrument note: picks the nearest sample and re-pitches it
  function playNote(inst, note, when, len, vol, dest) {
    const a = ac, want = midi(note);
    let best = null, bestD = 99;
    for (const k of Object.keys(SOUNDS[inst])) { const d = Math.abs(midi(k) - want); if (d < bestD) { bestD = d; best = k; } }
    const buf = buffers[inst + ':' + best]; if (!buf) return;

    src.playbackRate.value = Math.pow(2, (want - midi(best)) / 12);

    g.gain.setValueAtTime(vol, when);
    g.gain.setValueAtTime(vol, when + len);

  }

  // Goal sound: trumpet fanfare, two trumpets in harmony
  function fanfare(t) {
    const tune = [ // [time, length, top note, harmony note]
      [0.00, 0.12, 'G4', 'E4'], [0.14, 0.12, 'C5', 'G4'], [0.28, 0.12, 'E5', 'C5'],
      [0.42, 0.30, 'G5', 'E5'], [0.80, 0.12, 'E5', 'C5'], [0.94, 1.10, 'G5', 'E5']

  }
  function goalSound() {
    if (!state.sfx) return;

    });
  }

  // ---------- Background music (loops while Music is on) ----------
  const music = (() => {
    const BPM = 126, STEP = 60 / BPM / 2;           // eighth notes
    const chords = [ // per bar: bass root, octave, offbeat marimba chord
      ['C2', 'C3', ['C4', 'E4', 'G4']], ['A1', 'A2', ['C4', 'E4', 'A4']],
      ['F1', 'F2', ['C4', 'F4', 'A4']], ['G1', 'G2', ['D4', 'G4', 'B4']]
    ];
    const _ = null;
    const tune = [ // 8 bars x 8 eighths, marimba melody
      'E5', _, 'G5', _, 'E5', 'D5', 'C5', _,     'C5', _, 'E5', _, 'A5', _, 'G5', _,
      'F5', _, 'A5', _, 'G5', 'F5', 'E5', 'D5',  'D5', _, 'G5', _, 'B4', _, 'D5', _,
      'E5', 'G5', 'C6', _, 'G5', _, 'E5', _,     'A5', _, 'G5', 'E5', 'C5', _, 'E5', _,
      'F5', 'E5', 'F5', 'A5', 'G5', _, 'F5', _,  'D5', 'B4', 'G4', 'B4', 'D5', _, 'G5', _
    ];

    function out() {
      if (!bus) { bus = ac.createGain(); bus.gain.value = 0; bus.connect(ac.destination); }

    }

      while (nextT < ac.currentTime + 0.2) {

        if (e === 0 || e === 3) playNote('bass', root, nextT, STEP * 1.5, 0.9, out());

        if (e % 2 === 1) stab.forEach(n => playNote('marimba', n, nextT, STEP * 0.8, 0.22, out()));
        if (tune[s]) playNote('marimba', tune[s], nextT, STEP * 1.6, 0.6, out());

      start() {
        if (!state.music || timer || !ac || !buffers['marimba:C5']) return;
        const g = out().gain, t = ac.currentTime;
        g.cancelScheduledValues(t); g.setValueAtTime(0.0001, t); g.exponentialRampToValueAtTime(0.35, t + 0.8);

      stop() {

      }

  function whistle(blasts = [[0, 0.22], [0.3, 0.7]]) {
    if (!state.sfx) return;

    const t = a.currentTime;
    blasts.forEach(([d, len]) => {
      const o = a.createOscillator(); o.type = 'sine'; o.frequency.value = 2900;
      const lfo = a.createOscillator(); lfo.frequency.value = 38;
      const lg = a.createGain(); lg.gain.value = 180; lfo.connect(lg).connect(o.frequency);

    });
  }
  function sadTrombone() {
    if (!state.sfx) return;
    const a = audio();
    const t = a.currentTime;
    [[392, 0, .35], [370, .38, .35], [349, .76, .35], [330, 1.14, 1.0]].forEach(([f, d, len], k) => {
      const o = a.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      if (k === 3) {

        const lg = a.createGain(); lg.gain.value = 8; lfo.connect(lg).connect(o.frequency);

      g.gain.exponentialRampToValueAtTime(0.0001, t + d + len);

    });
  }

  // ---------- Canvases ----------
  const pitch = document.getElementById('pitch'), pc = pitch.getContext('2d');
  const fx = document.getElementById('fx'), fc = fx.getContext('2d');
  const bg = document.createElement('canvas'), bc = bg.getContext('2d');
  let W, H, dpr, F, portrait = false; // F = field rect in px + scale
  const FL = 105, FW = 68; // pitch size in metres

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    portrait = H > W * 1.05;
    document.body.classList.toggle('portrait', portrait);
    for (const c of [pitch, fx, bg]) { c.width = W * dpr; c.height = H * dpr; }
    for (const c of [pc, fc, bc]) c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const mx = W * 0.05, my = H * 0.05;
    F = { x: mx, y: my, w: W - 2 * mx, h: H - 2 * my };
    // su = px per metre along the pitch length, sv = across its width
    if (portrait) { F.su = F.h / FL; F.sv = F.w / FW; } else { F.su = F.w / FL; F.sv = F.h / FW; }
    F.s = Math.min(F.su, F.sv);
    F.rx = portrait ? F.sv : F.su; F.ry = portrait ? F.su : F.sv; // px per metre on screen x / y
    drawPitch();
  }
  // pitch position (u along the length, v across) -> screen [x, y]
  const P = (u, v) => portrait ? [F.x + v * F.sv, F.y + u * F.su] : [F.x + u * F.su, F.y + v * F.sv];

  function drawPitch() {
    const c = bc;
    c.fillStyle = '#1f9a3a'; c.fillRect(0, 0, W, H);
    // mown stripes across the length of the pitch
    const n = 14;
    for (let i = 0; i < n; i++) { c.fillStyle = i % 2 ? '#34c759' : '#2bb64e'; fillRect(FL / n * i, 0, FL / n * (i + 1) + 0.05, FW); }
    c.strokeStyle = 'rgba(255,255,255,.95)'; c.fillStyle = '#fff';
    c.lineWidth = Math.max(2, F.s * 0.35); c.lineJoin = 'round';
    box(0, FL, 0, FW);
    line(FL / 2, 0, FL / 2, FW);
    ellipse(FL / 2, FW / 2, 9.15); dot(FL / 2, FW / 2);
    for (const side of [0, 1]) {
      const m = u => side ? FL - u : u;
      box(m(0), m(16.5), FW / 2 - 20.15, FW / 2 + 20.15);
      box(m(0), m(5.5), FW / 2 - 9.15, FW / 2 + 9.15);
      dot(m(11), FW / 2);
      // penalty arc: only the part outside the box
      c.save(); c.beginPath(); rectPath(side ? 0 : 16.5, 0, side ? FL - 16.5 : FL, FW); c.clip();
      ellipse(m(11), FW / 2, 9.15); c.restore();
      // goal + net
      const u0 = m(0), u1 = side ? FL + 2.4 : -2.4, v0 = FW / 2 - 3.66, v1 = FW / 2 + 3.66;
      c.save();
      c.fillStyle = 'rgba(255,255,255,.25)'; fillRect(u0, v0, u1, v1);
      c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,.6)';
      for (let k = 0; k <= 8; k++) { const v = v0 + (v1 - v0) * k / 8; line(u0, v, u1, v); }
      for (let k = 0; k <= 3; k++) { const u = u0 + (u1 - u0) * k / 3; line(u, v0, u, v1); }
      c.lineWidth = Math.max(3, F.s * 0.5); c.strokeStyle = '#fff';
      c.beginPath(); c.moveTo(...P(u0, v0)); c.lineTo(...P(u1, v0)); c.lineTo(...P(u1, v1)); c.lineTo(...P(u0, v1)); c.stroke();
      c.restore();
    }
    // corner arcs
    for (const [u, v] of [[0, 0], [FL, 0], [0, FW], [FL, FW]]) ellipse(u, v, 1);
    function rectPath(u0, v0, u1, v1) {
      const [x0, y0] = P(u0, v0), [x1, y1] = P(u1, v1);
      c.rect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    }
    function fillRect(u0, v0, u1, v1) { c.beginPath(); rectPath(u0, v0, u1, v1); c.fill(); }
    function box(u0, u1, v0, v1) { c.beginPath(); rectPath(u0, v0, u1, v1); c.stroke(); }
    function line(a, b, cc, d) { c.beginPath(); c.moveTo(...P(a, b)); c.lineTo(...P(cc, d)); c.stroke(); }
    function ellipse(u, v, r) { c.beginPath(); c.ellipse(...P(u, v), r * F.rx, r * F.ry, 0, 0, Math.PI * 2); c.stroke(); }
    function dot(u, v) { c.beginPath(); c.arc(...P(u, v), Math.max(3, F.s * 0.4), 0, Math.PI * 2); c.fill(); }
  }

  // ---------- Little auto players ----------
  // Team 0 attacks right (goal at u=FL), team 1 attacks left.
  const formation = [[4, 34], [22, 18], [22, 50], [38, 34], [48, 22], [48, 46]];
  const players = [];
  for (const team of [0, 1]) formation.forEach(([u, v], k) => {
    const hu = team ? FL - u : u, hv = team ? FW - v : v;
    players.push({ team, gk: k === 0, hu, hv, u: hu, v: hv, num: k + 1, phase: Math.random() * 6, speed: 5 + Math.random() * 2.5 });
  });
  const ball = { u: FL / 2, v: FW / 2, vu: 0, vv: 0, cool: 0, spin: 0 };
  let celebrate = null; // { team, t }

  function pitchGoal(team) {
    celebrate = { team, t: 0 };
    const gu = team ? -1.5 : FL + 1.5;
    const tv = FW / 2 + (Math.random() - .5) * 5;
    ball.u = team ? 14 : FL - 14; ball.v = FW / 2 + (Math.random() - .5) * 14;
    const du = gu - ball.u, dv = tv - ball.v, d = Math.hypot(du, dv);
    ball.vu = du / d * 30; ball.vv = dv / d * 30; ball.cool = 99;
  }

  function step(dt) {
    // ball
    ball.u += ball.vu * dt; ball.v += ball.vv * dt;
    const fr = Math.exp(-1.1 * dt); ball.vu *= fr; ball.vv *= fr;
    ball.spin += Math.hypot(ball.vu, ball.vv) * dt * 0.6;
    ball.cool -= dt;
    if (celebrate) {
      celebrate.t += dt;
      if (ball.u < -2 || ball.u > FL + 2) { ball.u = Math.max(-2, Math.min(FL + 2, ball.u)); ball.vu = ball.vv = 0; }
      if (celebrate.t > 3.2) { celebrate = null; Object.assign(ball, { u: FL / 2, v: FW / 2, vu: 0, vv: 0, cool: 0.8 }); }
    } else {
      if (ball.u < 0.5) { ball.u = 0.5; ball.vu = Math.abs(ball.vu); }
      if (ball.u > FL - 0.5) { ball.u = FL - 0.5; ball.vu = -Math.abs(ball.vu); }
      if (ball.v < 0.5) { ball.v = 0.5; ball.vv = Math.abs(ball.vv); }
      if (ball.v > FW - 0.5) { ball.v = FW - 0.5; ball.vv = -Math.abs(ball.vv); }
    }
    // who chases: nearest outfield player of each team
    const chaser = [null, null];
    for (const p of players) {
      if (p.gk) continue;
      p.d = Math.hypot(p.u - ball.u, p.v - ball.v);
      if (!chaser[p.team] || p.d < chaser[p.team].d) chaser[p.team] = p;
    }
    for (const p of players) {
      let tu, tv, sp = p.speed;
      if (celebrate) {
        const win = p.team === celebrate.team;
        const gu = celebrate.team ? 8 : FL - 8;
        if (win) { tu = gu + Math.sin(p.phase * 3 + celebrate.t * 4) * 6; tv = FW / 2 + Math.cos(p.phase * 5 + celebrate.t * 4) * 10; sp *= 1.4; }
        else { tu = p.hu; tv = p.hv; sp *= 0.35; }
      } else if (p.gk) {
        tu = p.hu; tv = Math.max(FW / 2 - 5, Math.min(FW / 2 + 5, ball.v));
      } else if (chaser[p.team] === p) {
        tu = ball.u; tv = ball.v; sp *= 1.15;
      } else {
        const shift = (ball.u - FL / 2) * 0.55;
        tu = p.hu + shift + Math.sin(p.phase + performance.now() / 1300) * 3;
        tv = p.hv + (ball.v - p.hv) * 0.25 + Math.cos(p.phase + performance.now() / 1700) * 3;
      }
      const du = tu - p.u, dv = tv - p.v, d = Math.hypot(du, dv);
      if (d > 0.3) { const m = Math.min(d, sp * dt); p.u += du / d * m; p.v += dv / d * m; p.moving = true; }
      else p.moving = false;
      p.phase += dt * (p.moving ? 12 : 2);
      // kick
      if (!celebrate && ball.cool <= 0 && Math.hypot(p.u - ball.u, p.v - ball.v) < 1.6) {
        const gu = p.team ? 0 : FL;
        const passUp = Math.random() < 0.5;
        const tu2 = passUp ? p.u + (p.team ? -1 : 1) * (12 + Math.random() * 18) : gu;
        const tv2 = passUp ? 6 + Math.random() * (FW - 12) : FW / 2 + (Math.random() - .5) * 20;
        const du2 = tu2 - ball.u, dv2 = tv2 - ball.v, d2 = Math.hypot(du2, dv2) || 1;
        const pow = 12 + Math.random() * 10;
        ball.vu = du2 / d2 * pow; ball.vv = dv2 / d2 * pow; ball.cool = 0.45;
      }
    }
  }

  function drawPlayers() {
    const c = pc;
    c.drawImage(bg, 0, 0, W, H);
    const r = Math.max(9, F.s * 1.5);
    const sorted = [...players].sort((a, b) => P(a.u, a.v)[1] - P(b.u, b.v)[1]);
    for (const p of sorted) {
      const [x, gy] = P(p.u, p.v), y = gy - (p.moving ? Math.abs(Math.sin(p.phase)) * r * 0.25 : 0);
      const col = state.teams[p.team].color;
      // shadow
      c.fillStyle = 'rgba(0,0,0,.25)';
      c.beginPath(); c.ellipse(x, gy + r * 0.9, r * 0.9, r * 0.35, 0, 0, Math.PI * 2); c.fill();
      // legs
      c.strokeStyle = '#222'; c.lineWidth = r * 0.28; c.lineCap = 'round';
      const sw = p.moving ? Math.sin(p.phase) * r * 0.4 : 0;
      c.beginPath(); c.moveTo(x - r * 0.3, y + r * 0.5); c.lineTo(x - r * 0.3 + sw, y + r * 1.05);
      c.moveTo(x + r * 0.3, y + r * 0.5); c.lineTo(x + r * 0.3 - sw, y + r * 1.05); c.stroke();
      // body
      c.fillStyle = p.gk ? '#ffe600' : col; c.strokeStyle = '#fff'; c.lineWidth = Math.max(2, r * 0.18);
      c.beginPath(); c.arc(x, y, r * 0.75, 0, Math.PI * 2); c.fill(); c.stroke();
      // head
      c.fillStyle = '#ffd7b0';
      c.beginPath(); c.arc(x, y - r * 0.95, r * 0.42, 0, Math.PI * 2); c.fill();
      c.lineWidth = Math.max(1.5, r * 0.1); c.strokeStyle = 'rgba(0,0,0,.35)'; c.stroke();
      // number
      c.fillStyle = p.gk ? '#222' : '#fff'; c.font = `${Math.round(r * 0.8)}px ${getComputedStyle(document.body).fontFamily}`;
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(p.num, x, y + r * 0.05);
    }
    // ball
    const br = Math.max(6, F.s * 0.75), [bx, by] = P(ball.u, ball.v);
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(bx, by + br * 0.9, br, br * 0.4, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.strokeStyle = '#222'; c.lineWidth = Math.max(1.5, br * 0.18);
    c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#222';
    for (let k = 0; k < 3; k++) {
      const a = ball.spin + k * 2.1;
      c.beginPath(); c.arc(bx + Math.cos(a) * br * 0.45, by + Math.sin(a) * br * 0.45, br * 0.28, 0, Math.PI * 2); c.fill();
    }
  }

  // ---------- Confetti ----------
  const bits = [];
  function confetti(team) {
    const col = state.teams[team].color;
    const palette = [col, col, '#ffe600', '#fff', '#00e5ff', '#ff8a00'];
    const cx = portrait ? W * 0.5 : team ? W * 0.75 : W * 0.25;
    for (let i = 0; i < 220; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 1.6, s = 500 + Math.random() * 900;
      bits.push({ x: cx + (Math.random() - .5) * W * 0.2, y: H + 10, vx: Math.cos(a) * s * 0.6, vy: Math.sin(a) * s,
        w: 6 + Math.random() * 10, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * 14,
        c: palette[i % palette.length], life: 4 + Math.random() * 2 });
    }
  }
  function drawConfetti(dt) {
    fc.clearRect(0, 0, W, H);
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.vy += 900 * dt; b.vx *= Math.exp(-1.5 * dt); b.vy *= Math.exp(-0.9 * dt);
      b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt; b.life -= dt;
      if (b.life <= 0 || b.y > H + 40) { bits.splice(i, 1); continue; }
      fc.save(); fc.translate(b.x, b.y); fc.rotate(b.r); fc.scale(1, Math.cos(b.r * 1.7));
      fc.globalAlpha = Math.min(1, b.life); fc.fillStyle = b.c; fc.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      fc.restore();
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt); drawPlayers(); drawConfetti(dt);
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  resize();
  document.fonts?.ready.then(drawPitch);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
